
services:

  # ----------------------------------------
  # 1. PostgreSQL - Relational Database
  # ----------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ----------------------------------------
  # 2. ChromaDB - Vector Database
  # ----------------------------------------
  chroma_db:
    image: chromadb/chroma:latest
    container_name: chroma_vector_db
    restart: unless-stopped

    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"

    ports:
      - "8001:8000"

    volumes:
      - chroma_data:/chroma/chroma

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # ----------------------------------------
  # 3. FastAPI - Backend
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}

      CHROMA_HOST: chroma_db
      CHROMA_PORT: "8000"

      UPLOAD_DIR: /app/uploads

    volumes:
      # Live backend source-code changes
      - ./backend:/app

      # Persistent uploaded documents
      - uploaded_documents:/app/uploads

    depends_on:
      postgres_db:
        condition: service_healthy

      chroma_db:
        condition: service_healthy

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload


  # ----------------------------------------
  # 4. Next.js - Frontend
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    volumes:
      # Live frontend source-code changes
      - ./frontend:/app

      # Isolated Node dependencies
      - frontend_node_modules:/app/node_modules

      # Keep Next.js development build output in container
      - frontend_next:/app/.next

    depends_on:
      - backend

    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0


# ----------------------------------------
# Persistent Docker Volumes
# ----------------------------------------
volumes:

  postgres_data:
    name: rag_postgres_data

  chroma_data:
    name: rag_chroma_data

  uploaded_documents:
    name: rag_uploaded_documents

  frontend_node_modules:
    name: rag_frontend_node_modules

  frontend_next:
    name: rag_frontend_next